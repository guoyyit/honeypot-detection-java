spring.application.name=honeypot-detection-java

# Honeypot / deception defense configuration
honeypot.data-dir=./honeypot-data
honeypot.admin-token=change-me
honeypot.alert-cooldown-millis=300000
honeypot.admin-path-prefix=/api/honeypot
# Demo legitimate users for the sample login endpoint
honeypot.legit-users.alice=alice-secret
