spring.application.name=honeypot-detection-java
honeypot.state-file=${java.io.tmpdir}/honeypot-state.json
honeypot.admin-token=change-me-admin-token
honeypot.alert-cooldown-millis=60000
honeypot.internal-marker=HONEYPOT-INTERNAL-MARKER
honeypot.health-path=/healthz
honeypot.internal-probe.interval-millis=86400000
